apiVersion: v1
kind: Service
metadata:
  name: appointments-api
  namespace: appointments
spec:
  # LoadBalancer gives the service a public IP directly from AKS. Once you
  # have a domain/ingress controller set up, switch this to ClusterIP and
  # front it with an Ingress resource instead.
  type: LoadBalancer
  selector:
    app: appointments-api
  ports:
    - port: 80
      targetPort: 8080
