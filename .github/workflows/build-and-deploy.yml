# Builds the Appointments microservice container image, pushes it to Azure
# Container Registry, then deploys it to Azure Kubernetes Service.
#
# This mirrors the two GitHub Actions exercises in the Microsoft Learn module
# "Deploy a cloud-native .NET microservice automatically with GitHub Actions
# and Azure Pipelines", combined into one workflow with two jobs so a single
# push does the whole thing.
#
# One-time setup required before this will run successfully — see
# docs/AZURE_SETUP.md for the exact `az` CLI commands. In short you need:
#   1. An Azure resource group, Container Registry (ACR), and AKS cluster.
#   2. A Microsoft Entra app registration with a federated credential trusting
#      this repo (OIDC — no client secret to store or rotate).
#   3. These GitHub Actions secrets/variables set on this repo:
#        secrets.AZURE_CLIENT_ID
#        secrets.AZURE_TENANT_ID
#        secrets.AZURE_SUBSCRIPTION_ID
#        vars.ACR_NAME        (e.g. "appointmentsacr", no domain suffix)
#        vars.AKS_CLUSTER_NAME
#        vars.AKS_RESOURCE_GROUP

name: Build and deploy Appointments API

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

env:
  IMAGE_NAME: appointments-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image with ACR Tasks
        id: set-image
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            --file src/Appointments.Api/Dockerfile \
            src/Appointments.Api
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Deploy manifests
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image }}"
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|" k8s/deployment.yaml > /tmp/deployment.yaml

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f /tmp/deployment.yaml
          kubectl apply -f k8s/service.yaml

          kubectl rollout status deployment/appointments-api -n appointments --timeout=180s

      - name: Show public endpoint
        run: |
          kubectl get service appointments-api -n appointments
