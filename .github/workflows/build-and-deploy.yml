# Builds the Appointments microservice container image, pushes it to Azure
# Container Registry, then deploys it to Azure Container Apps.
#
# One-time setup (already done manually in Cloud Shell): the resource group,
# ACR, the Container Apps environment "cae-appointments", and the app
# "appointments-api" itself. This workflow only builds new images and tells
# the existing app to use the new one — see docs/AZURE_SETUP.md.

name: Build and deploy Appointments API

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

env:
  IMAGE_NAME: appointments-api
  CONTAINERAPP_NAME: appointments-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image with ACR Tasks
        id: set-image
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            --file src/Appointments.Api/Dockerfile \
            src/Appointments.Api
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy new image to Container Apps
        run: |
          az containerapp update \
            --name "${{ env.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.image }}"

      - name: Show public URL
        id: url
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "### API desplegada: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$FQDN"

      # Comprueba que la nueva versión arrancó de verdad. Container Apps tarda
      # un poco en activar la revisión nueva, así que reintenta hasta ~3 min.
      # Si /healthz nunca responde 200, el workflow falla y lo verás en rojo.
      - name: Smoke test (/healthz)
        run: |
          URL="https://${{ steps.url.outputs.fqdn }}"
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL/healthz" || echo 000)
            echo "Intento $i: /healthz -> $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Raíz de la API:"
              curl -s --max-time 10 "$URL/"; echo
              echo "✅ Smoke test OK" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "❌ /healthz no respondió 200 tras el deploy" >> "$GITHUB_STEP_SUMMARY"
          exit 1
